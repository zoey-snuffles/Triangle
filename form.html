<body>
  <div class="header">

  <p>Enter your destination, dates and amount of guests, then click "Submit" to submit the form:</p>

  <form id="frm1" method="get" action="form.html" )>
    destination: <input id="destination" type="text" name="country"><br><br>
    dates: <input id="dates" type="date" name="year"><br><br>
    guests:<select id="amountOfPeople">

      <option value=2>2</option>
      <option value=2>3</option>
      <option value=3>4</option>
    </select><br><br>
    <input type="button" onclick="validateForm()" value="Submit">
  </form>

  <script>
    function submitForm() {
      document.writeln("Your country of birth is: " + document.getElementById("frm1").elements[0].value + " and your year of birth is: " +
        document.getElementById("frm1").elements[1].value + " and your gender is: " + document.getElementById("frm1").elements[2].value);

      document.getElementById("frm1").submit();
    }

    function validateForm() {
      //Regexs for validation, match only letters.
      var letters = /^[A-Za-z]+$/;


      //get form 
      var myForm = document.getElementById('frm1');
      //get textboxes
      var cob = myForm.elements[0].value;
      var yob = myForm.elements[1].value;
      //get select
      var gndr = myForm.elements[2].value;

      console.log(cob.value)
      //validate the value of CountryOfBirth, Only letters allowed, no spaces, symbols or numbers.
      if (!cob.match(letters)) {
        alert('Please enter a valid destination');
        return false;
      }
      myform.submit();
    }

  </script>
